<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the scene runs under notches and the home indicator; the HUD stays
         inside the safe area (CSS --safe-*). Page zoom stays allowed: the canvas has touch-action:
         none, so pinching the scene zooms the scene, and pinching the HUD still zooms the page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Synthwave coloring-book style Three.js animation of a Bolones driving into the sunset, with a minigame."
    />
    <title>Bolones Autodrive</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- dark browser background from the first paint, not a white flash -->
    <meta name="color-scheme" content="dark" />
    <!-- browser chrome in the UI pink (content set by ui/theme.js from PALETTE) -->
    <meta name="theme-color" content="" />
    <!-- nothing shows until the styles and theme.js colors are in (no unstyled flash); kept
         inline, as the stylesheet itself arrives later -->
    <style>
      :root:not([data-theme]) body {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="loader__terminal">
        <div class="loader__header"></div>
        <div class="loader__content">
          <div class="loader__text"></div>
          <div class="loader__progress"></div>
          <div class="loader__status"></div>
          <span class="loader__cursor" aria-hidden="true">█</span>
        </div>
      </div>
    </div>
    <div class="hud" id="hud">
      <!-- Like the DISPLAY/OSD button of an 80s remote: hides the menu or game over, keeps the
           scene. -->
      <button class="button button--small hud__toggle" type="button" data-action="menu">
        <span class="hud__toggle-icon" data-icon="eye"></span>
        <span data-text="hide"></span><kbd data-key="menu"></kbd>
      </button>
      <section class="hud__menu" data-label="menu">
        <h1 class="logo hud__fade">
          <span class="logo__script sunset-text" data-text="logoScript"></span>
          <span class="logo__caps" data-text="logoCaps"></span>
        </h1>
        <!-- the best score of each mode of the minigame that has one -->
        <p class="hud__best hud__fade" hidden>
          <span data-text="best"></span>
          <span class="hud__record" data-record="dodge">
            <span data-text="dodge"></span> <span data-value></span>
          </span>
          <span class="hud__record" data-record="crash">
            <span data-text="crash"></span> <span data-value></span>
          </span>
          <span class="hud__record" data-record="overtake">
            <span data-text="overtake"></span> <span data-value></span>
          </span>
        </p>
        <!-- PRESS START, as an arcade machine waits for a player: ENTER (a tap) lists what to play;
             on a touch screen, what a minigame does with it -->
        <div class="hud__start hud__bottom hud__fade">
          <button class="hud__press" type="button" data-action="start">
            <span class="hud__keys-only"
              ><span data-text="press"></span> <kbd data-key="start"></kbd>
              <span data-text="toStart"></span
            ></span>
            <span class="hud__touch-only" data-text="tapToStart"></span>
          </button>
          <p class="hud__start-note hud__touch-only" data-text="sideways"></p>
        </div>
        <!-- what to play in place of PRESS START: the minigames and free ride, the chosen one lit
             (ui/hud.js) -->
        <div class="hud__games hud__fade">
          <div class="button-grid">
            <button class="button hud__game" type="button" data-action="dodge">
              <span class="hud__game-name" data-text="dodge"></span>
              <span class="hud__game-about" data-text="dodgeAbout"></span>
              <span class="hud__game-best" data-record="dodge">
                <span data-text="best"></span> <span data-value></span>
              </span>
            </button>
            <button class="button hud__game" type="button" data-action="crash">
              <span class="hud__game-name" data-text="crash"></span>
              <span class="hud__game-about" data-text="crashAbout"></span>
              <span class="hud__game-best" data-record="crash">
                <span data-text="best"></span> <span data-value></span>
              </span>
            </button>
            <button class="button hud__game" type="button" data-action="overtake">
              <span class="hud__game-name" data-text="overtake"></span>
              <span class="hud__game-about" data-text="overtakeAbout"></span>
              <span class="hud__game-best" data-record="overtake">
                <span data-text="best"></span> <span data-value></span>
              </span>
            </button>
            <button class="button hud__game" type="button" data-action="free">
              <span class="hud__game-name" data-text="freeRide"></span>
              <span class="hud__game-about" data-text="freeRideAbout"></span>
            </button>
          </div>
          <p class="hud__games-keys">
            <kbd data-key="left"></kbd><kbd data-key="right"></kbd> <span data-text="choose"></span>
            <span class="hud__dot">·</span>
            <kbd data-key="start"></kbd> <span data-text="play"></span>
          </p>
          <button class="button button--small" type="button" data-action="exit">
            <span data-text="menu"></span><kbd data-key="exit"></kbd>
          </button>
        </div>
        <a
          class="hud__source hud__fade"
          href="https://github.com/SkorczanFFF"
          target="_blank"
          rel="noopener"
          data-text="source"
        ></a>
      </section>

      <div class="hud__corner panel">
        <span class="hud__tag" data-text="freeRide"></span>
        <kbd data-key="left"></kbd><kbd data-key="right"></kbd> <span data-text="steer"></span>
        <span class="hud__dot">·</span>
        <span class="hud__faster">
          <kbd data-key="faster"></kbd> <span data-text="faster"></span>
          <span class="hud__dot">·</span>
        </span>
        <span class="hud__slower" data-modes="overtake" hidden>
          <kbd data-key="slower"></kbd> <span data-text="slower"></span>
          <span class="hud__dot">·</span>
        </span>
        <kbd data-key="exit"></kbd> <span data-text="exit"></span>
      </div>

      <!-- Touch screens: the keys on screen, held like them: the arrows on the left, in a minigame
           the pedals on the right (the brake in Overtake only), and a way back -->
      <div class="hud__touch">
        <div class="hud__touch-side">
          <button class="button hud__touch-key" type="button" data-hold="left">
            <span data-key="left"></span>
          </button>
          <button class="button hud__touch-key" type="button" data-hold="right">
            <span data-key="right"></span>
          </button>
        </div>
        <button class="button hud__touch-exit" type="button" data-action="exit">
          <span data-text="menu"></span>
        </button>
        <div class="hud__touch-side hud__touch-pedals">
          <button
            class="button hud__touch-key"
            type="button"
            data-hold="slower"
            data-modes="overtake"
          >
            <span data-key="slower"></span>
          </button>
          <button class="button hud__touch-key hud__touch-gas" type="button" data-hold="faster">
            <span data-key="faster"></span>
          </button>
        </div>
      </div>

      <!-- a touch screen held upright: the minigame waits for it to turn (main.js) -->
      <div class="hud__turn">
        <span class="hud__turn-phone"></span>
        <span data-text="turnSideways"></span>
      </div>

      <div class="hud__countdown sunset-text" hidden></div>

      <div class="hud__scoreboard scoreboard panel" aria-live="polite" hidden>
        <div class="stat">
          <span class="stat__label" data-text="best"></span
          ><span class="stat__value" data-best></span>
        </div>
        <div class="stat stat--main">
          <span class="stat__label" data-text="score"></span
          ><span class="stat__value" data-score></span>
        </div>
        <div class="stat">
          <span class="stat__label" data-text="level"></span
          ><span class="stat__value" data-level></span>
        </div>
      </div>

      <!-- the Bolones' speedometer, digital, as on a dash -->
      <div class="hud__speedometer">
        <span class="hud__speed-value" data-speed></span>
        <span class="hud__speed-unit" data-text="speed"></span>
      </div>

      <div class="hud__flash" aria-hidden="true"></div>

      <!-- the result with the title over the sky, what next at the bottom: the wreck stays in
           view -->
      <section class="hud__gameover" data-label="gameOver" aria-live="assertive">
        <header class="hud__gameover-head hud__fade">
          <!-- a crash is crash mode's goal: no game over there, the score alone -->
          <h2
            class="hud__gameover-title sunset-text"
            data-text="gameOver"
            data-modes="dodge overtake"
          ></h2>
          <div class="hud__result scoreboard panel">
            <div class="stat stat--main">
              <span class="stat__label" data-text="score"></span>
              <span class="stat__value hud__final-score" data-final-score></span>
            </div>
          </div>
          <!-- what made it: the level reached, or what the crash wrecked -->
          <p class="hud__facts">
            <span data-modes="dodge overtake"
              ><span data-text="level"></span> <span data-level></span
            ></span>
            <span class="hud__tally" data-modes="crash" hidden></span>
          </p>
          <!-- the record to beat; NEW BEST! in its place once the count passes it -->
          <p class="hud__final-best"><span data-text="best"></span> <span data-best></span></p>
          <p class="hud__new-best" data-text="newBest" hidden></p>
        </header>
        <!-- the car the camera follows (the Bolones first), from the crash on, in the corner: it
             stays with the rest hidden, as does how to look around, to watch the wreck -->
        <button class="button button--small hud__wreck" type="button" data-action="next">
          <span data-wreck></span><span class="hud__wreck-count" data-wreck-count></span>
          <kbd data-key="next"></kbd>
        </button>
        <footer class="hud__gameover-actions">
          <!-- the Bolones is still the player's -->
          <p class="hud__gameover-hint hud__drive-on hud__fade" hidden>
            <kbd data-key="left"></kbd><kbd data-key="right"></kbd><kbd data-key="faster"></kbd>
            <span data-text="driveOn"></span>
          </p>
          <div class="button-grid button-grid--3 hud__gameover-buttons hud__fade">
            <button class="button button--primary" type="button" data-action="start">
              <span data-text="again"></span><kbd data-key="start"></kbd>
            </button>
            <button class="button" type="button" data-action="free">
              <span data-text="freeRide"></span><kbd data-key="free"></kbd>
            </button>
            <button class="button" type="button" data-action="exit">
              <span data-text="menu"></span><kbd data-key="exit"></kbd>
            </button>
          </div>
          <!-- at the very bottom: it stays with the rest hidden -->
          <p class="hud__gameover-hint">
            <span class="hud__keys-only" data-text="lookAround"></span
            ><span class="hud__touch-only" data-text="lookAroundTouch"></span>
          </p>
        </footer>
      </section>
    </div>
    <!-- F10 developer stats (ui/devstats.js fills the texts and values) -->
    <div class="devstats panel" id="devstats" hidden>
      <div class="devstats__header" data-text="title"></div>
      <div class="devstats__fps">
        <span class="devstats__fps-value" data-fps>--</span><span data-text="fps"></span>
      </div>
      <dl class="devstats__rows">
        <dt data-text="calls"></dt>
        <dd data-stat="calls">--</dd>
        <dt data-text="triangles"></dt>
        <dd data-stat="triangles">--</dd>
        <dt data-text="geometries"></dt>
        <dd data-stat="geometries">--</dd>
        <dt data-text="textures"></dt>
        <dd data-stat="textures">--</dd>
        <dt data-text="programs"></dt>
        <dd data-stat="programs">--</dd>
      </dl>
    </div>
    <div class="crt" id="crt" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
